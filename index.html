<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Logístico Integrado</title>
  <style>
    :root {
      --bg-body: #0a0a0a;
      --primary: #FFE600;
      --primary-hover: #e6cf00;
      --text-main: #ffffff;
      --text-dim: #aaaaaa;
    }
    
    * { 
      box-sizing: border-box; 
      -webkit-tap-highlight-color: transparent; 
      font-family: 'Segoe UI', Roboto, sans-serif; 
    }
    
    body { 
      margin: 0; 
      background-color: var(--bg-body); 
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 1px;
      color: var(--primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    p {
      color: var(--text-dim);
      font-size: 16px;
      margin-bottom: 40px;
      max-width: 400px;
    }

    .btn-redirect {
      background-color: var(--primary);
      color: #000000;
      text-decoration: none;
      padding: 18px 40px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      text-transform: uppercase;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 230, 0, 0.15);
    }

    .btn-redirect:hover {
      background-color: var(--primary-hover);
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(255, 230, 0, 0.3);
    }
  </style>
</head>
<body>

  <div class="logo">📦 LOGÍSTICA INTEGRADA</div>
  <p>O sistema foi atualizado e movido para um novo endereço seguro.</p>
  
  <a href="https://script.google.com/a/macros/mercadolivre.com/s/AKfycbxMA_VCIMy-JyxgJuwwBkNrK2xkO5llojtJ8apNTS3N9Y9XK3t-l64lNTFjjNNWImVGCA/exec" class="btn-redirect">
    Acessar o Novo Sistema
  </a>

</body>
</html>
